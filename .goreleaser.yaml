version: 2

project_name: ym

builds:
  - id: ym
    main: ./cmd/ym
    binary: ym
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version=v{{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: ym
    ids: [ym]
    formats: [tar.gz]
    name_template: "ym_{{ title .Os }}_{{ if eq .Arch \"amd64\" }}x86_64{{ else }}{{ .Arch }}{{ end }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: ym
    ids: [ym]
    binaries: [ym]
    homepage: https://github.com/mateuszjasiuk/yardmaster
    description: Terminal deck for managing git worktrees and coding agents
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_TOKEN "" }}true{{ else }}false{{ end }}'
    repository:
      owner: mateuszjasiuk
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: yardmaster-release
      email: 41898282+github-actions[bot]@users.noreply.github.com

changelog:
  use: github
  sort: asc

release:
  draft: true
  prerelease: auto
  name_template: "ym {{ .Tag }}"
